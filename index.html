<!-- Include Supabase JS SDK in your <head> -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Log-in & Summary Box -->
<div class="summary-box">
  <h3>Student Log-in & Grade Summary</h3>

  <div class="input-group">
    <label for="full_name">Full Name:</label>
    <input type="text" id="full_name" placeholder="Full Name" required>

    <label for="student_lrn">Student ID / LRN:</label>
    <input type="text" id="student_lrn" placeholder="Student ID / LRN" required>
  </div>

  <div class="input-group">
    <label for="grade_section">Grade & Section:</label>
    <input type="text" id="grade_section" placeholder="12-Adams" required>

    <label for="submission_date">Date:</label>
    <input type="date" id="submission_date">
  </div>

  <div class="score-display">
    <div>
      <span>TOTAL SCORE</span>
      <h2 id="score-text">-- / 60</h2>
    </div>
    <div>
      <span>PERCENTAGE GRADE</span>
      <h2 id="percentage-text">--%</h2>
    </div>
    <div>
      <span>REMARKS</span>
      <h2 id="remarks-text">--</h2>
    </div>
  </div>
</div>

<!-- Action Buttons -->
<div class="button-group">
  <button type="button" onclick="window.print()" class="btn-print">Print Test</button>
  <button type="button" id="submit-btn" class="btn-submit">Submit Test & Save</button>
</div>
